name: Fabriquer le mod Minecraft

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Compiler le mod
        working-directory: Minecraft_Guns_V2_Fabric_1.21.1_SOURCE
        run: |
          
          gradle build

      - name: Recuperer le JAR
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Guns
          path: Minecraft_Guns_V2_Fabric_1.21.1_SOURCE/build/libs/*.jar
        
